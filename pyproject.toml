[project]
name = "sophiarch-notebooks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2",
    "faiss-cpu>=1.15.0",
    "imbalanced-learn>=0.13",
    "lightgbm>=4.3",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "pytest",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=6.0.1",
    "shap>=0.46",
    "statsmodels>=0.14",
    "torch>=2.12.0",
    "xgboost>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
