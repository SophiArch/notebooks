[project]
name = "sophiarch-notebooks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the versions Colab ships, which is what learners run. Refresh from
    # https://github.com/googlecolab/backend-info/blob/main/pip-freeze.txt (see README).
    "imbalanced-learn==0.14.2",
    "lightgbm==4.6.0",
    "matplotlib==3.10.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pydantic==2.14.1",
    "pytest==8.4.2",
    "scikit-learn==1.6.1",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "sentence-transformers==5.7.0",
    "shap==0.54.1",
    "statsmodels==0.15.0",
    "torch==2.11.0",
    "transformers==5.20.2",
    "xgboost==3.4.1",
    # Not preinstalled on Colab; labs install the latest with !pip install.
    "catboost>=1.2",
    "faiss-cpu>=1.15.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "ipykernel==6.17.1",
    "nbclient==0.10.4",
    "nbformat==5.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["execute: runs the lab notebooks end to end (slow; opt in with -m execute)"]
addopts = "-m 'not execute'"
